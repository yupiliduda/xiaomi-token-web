services:
  web:
    image: node:22-slim
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run serve"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    labels:
      base44.project: "Xiaomi Token Web"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure

volumes:
  node_modules:
